variables:
  GCP_ID_TOKEN_AUDIENCE: "unset"
  GIT_SUBMODULE_STRATEGY: none
  CI_DISPOSABLE_ENVIRONMENT: "true"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: 1

default:
  id_tokens:
    GCP_ID_TOKEN:
      aud: $GCP_ID_TOKEN_AUDIENCE
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["dockerd", "--host=tcp://0.0.0.0:2375"]
      alias: "docker"
  before_script:
    - sh scripts/registry-login.sh
    - docker info
    - docker buildx create
      --driver=docker-container
      --name=buildkit-builder
      --use
      --platform linux/amd64,linux/arm64
  tags:
    - cloud
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure

stages:
  - build_push

build_bitcoind:
  stage: build_push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH: "false"
        PLATFORMS: "linux/amd64"
      changes:
        - bitcoind/**
        - scripts/**
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: true
      changes:
        - bitcoind/**
        - scripts/**
        - .gitlab-ci.yml
  script:
    - cd bitcoind && sh ./build-and-push-to-dockerhub.sh

